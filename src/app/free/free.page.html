<ion-content [fullscreen]="true" class="screen">
  @if (!foldable() || liveAngle() === null) {
    <section class="notice">
      <h1>Needs a hinge</h1>
      <p class="note">Open this on a Galaxy Z Fold, a Pixel Fold or an iPhone Duo to read the angle.</p>
    </section>
  } @else if (!open()) {
    <app-unfold-prompt message="The meter reads the inside screen." />
  } @else {
    <main class="instrument">
      <app-angle-dial class="dial" [angle]="liveAngle() ?? 0" kind="live" />

      <section class="page set">
        <p class="pose">{{ pose() }}</p>
        <p class="note">The needle follows the hinge as you fold.</p>
      </section>

      <section class="page read">
        <p class="reading" aria-live="polite">{{ liveAngle() | number: '1.1-1' }}°</p>
      </section>
    </main>
  }
</ion-content>
