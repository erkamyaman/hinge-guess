@if (mode() === 'game') {
  <app-game />
} @else {
  <app-free />
}

@if (!native) {
  <nav class="modes">
    <button type="button" [class.on]="mode() === 'game'" (click)="mode.set('game')">Game</button>
    <button type="button" [class.on]="mode() === 'free'" (click)="mode.set('free')">Meter</button>
  </nav>
}
